---
fixes:
  - |
    Fixed a crash in the MPL and text circuit drawers when ``cregbundle=True`` and a circuit
    contains non-builder-style control flow (e.g., ``IfElseOp`` constructed directly
    or via ``QuantumCircuit.compose``). Such circuits create inner block circuits with
    independent ``Clbit`` objects that do not belong to the outer circuit; the drawers
    were incorrectly calling ``get_bit_register`` on the outer circuit for these inner
    bits, causing a ``CircuitError``.
    Fixes `#15823 <https://github.com/Qiskit/qiskit/issues/15823>`__ and
    `#15822 <https://github.com/Qiskit/qiskit/issues/15822>`__.
